name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify editable installation
        run: python -m pip install -e .
      - name: CLI end-to-end smoke test
        run: |
          python examples/make_demo.py
          sheetguard examples/demo.xlsx --require-protection --fail-on warning
          sheetguard examples/demo.xlsx --format json --output smoke-report.json
          python -c 'import json; r = json.load(open("smoke-report.json")); assert r["summary"]["sheets"] == 1 and r["summary"]["errors"] == 0'
      - name: Build import check
        run: PYTHONPATH=src python -c 'import sheetguard_oss; print(sheetguard_oss.__version__)
